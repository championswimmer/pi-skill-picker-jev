name: Update release changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (e.g. v0.3.0)'
        required: true
        type: string

permissions:
  contents: write

# All tags write the same file on the default branch; serialize those writes.
concurrency:
  group: release-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Commit to the default branch, never move or rewrite the release tag.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate PR-based notes for the release tag range
        run: node scripts/update-changelog.ts

      - name: Commit updated changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "Changelog already up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${RELEASE_TAG}"
          # Rebase if another ordinary commit arrived while notes were generated.
          for attempt in 1 2 3; do
            git pull --rebase origin "$DEFAULT_BRANCH"
            if git push origin "HEAD:${DEFAULT_BRANCH}"; then
              exit 0
            fi
          done
          exit 1
